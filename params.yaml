ingest:
  url: https://raw.githubusercontent.com/ommadav/Indian-Milk-Adulteration-Detection-Dataset/main/milk_combined_full_dataset.csv
  sha256: 7186d94e39e281863f3698f89610e7f3fd6ed4318f9fb9b85e06e24d724dfc18
  output: data/raw/milk_combined_full_dataset.csv

validate:
  input: data/raw/milk_combined_full_dataset.csv
  output: data/interim/milk_clean.csv
  rejected: data/interim/milk_rejected.csv

eda:
  input: data/interim/milk_clean.csv
  report: reports/eda.md
  metrics: reports/eda_summary.json

split:
  input: data/interim/milk_clean.csv
  output_dir: data/processed
  seed: 42
  val_size: 0.15
  test_size: 0.15

baselines:
  seed: 42
  target_recall: 0.95
  bootstrap_rounds: 1000
  stage2_cv_folds: 5
  stage2_cv_repeats: 5
  report: reports/baselines.md
  metrics: reports/baselines.json
  mlflow:
    tracking_uri: sqlite:///mlflow.db
    experiment: baselines
  logreg:
    C: 1.0
    max_iter: 2000
  random_forest:
    n_estimators: 500
    min_samples_leaf: 1

augment:
  input: data/processed/train.csv
  output: data/processed/train_aug.csv
  seed: 42
  target_per_class: 300
  # Each synthetic row = random pure train row + dose * (real positive - its milk type's pure mean)
  dose_range: [0.5, 1.5]
  # Masked fraud: two adulterants in one sample. Used for Stage 1 only.
  combos:
    - [water, starch]
    - [water, urea]
  rows_per_combo: 150
  # Stretch copies of real pure rows onto typical published ranges for pure cow and
  # buffalo milk, which are wider than the synthetic data's pure-milk ranges.
  # Approximate literature values; replace them with your own lab's pure-milk data.
  # The freezing-point upper bound stays at -0.520 C so that small amounts of added
  # water remain detectable.
  widen_pure:
    rows: 2000
    ranges:
      fat_pct: [0.1, 8.0]
      snf_pct: [8.3, 10.0]
      density: [1.027, 1.034]
      ph: [6.55, 6.8]
      freezing_point: [-0.560, -0.520]
      conductivity: [3.5, 5.5]

train:
  seed: 42
  # "cpu" or "cuda" (NVIDIA GPU; needs the full `xgboost` package, see GUIDE.md).
  # The saved model is always switched back to CPU so the API can serve it.
  device: cpu
  n_jobs: 4
  cv_folds: 5
  n_trials_stage1: 30
  n_trials_stage2: 30
  # Decided with the user: the recall target covers adulterants field readings can
  # detect, so Stage 1 does not train on `other` (formalin, H2O2, veg oil, melamine).
  stage1_exclude_other: true
  target_recall: 0.95
  # Calibrated risk at or above this is "reject"; between the threshold and this, "retest".
  reject_risk: 0.5
  model: models/cascade.joblib
  cv_report: reports/train_cv.json
  mlflow:
    tracking_uri: sqlite:///mlflow.db
    experiment: cascade

evaluate:
  bootstrap_rounds: 1000
  report: reports/model.md
  metrics: reports/model_metrics.json

promote:
  registered_model: milk-adulteration-cascade
  alias: production
  # Hard gates on test (detectable adulterants), then no regression against the
  # current production model on test PR-AUC and recall.
  min_recall: 0.95
  min_precision: 0.80
  model_info: models/model_info.json
  report: reports/promotion.json

stress_test:
  seed: 0
  samples: 2000
  # Typical published normal ranges for pure milk (approximate dairy-literature
  # values), wider than the synthetic training data. These are NOT real samples.
  populations:
    cow:
      fat_pct: [3.0, 5.0]
      snf_pct: [8.3, 9.2]
      density: [1.027, 1.033]
      ph: [6.6, 6.8]
      freezing_point: [-0.550, -0.520]
      conductivity: [4.0, 5.5]
    buffalo:
      fat_pct: [5.0, 8.0]
      snf_pct: [9.0, 10.0]
      density: [1.030, 1.034]
      ph: [6.6, 6.8]
      freezing_point: [-0.560, -0.530]
      conductivity: [3.5, 5.0]
  # The one-reading sweep uses this population.
  sweep_population: cow
  # Mixing law: reading' = (1 - w) * reading + w * water
  water: {fat_pct: 0.0, snf_pct: 0.0, density: 0.998, ph: 7.0, freezing_point: 0.0, conductivity: 0.5}
  water_fractions: [0.03, 0.05, 0.10, 0.15, 0.20, 0.30]
  sweep_points: 9
  report: reports/stress_test.md
  metrics: reports/stress_test.json
