[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milk-adulteration"
version = "0.1.0"
description = "Two-stage milk adulteration detection service (MLOps project)"
readme = "README.md"
requires-python = ">=3.11"
# Core: what loading and running the model needs.
dependencies = [
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
]
train = ["mlflow>=3.0", "optuna>=4.0", "requests>=2.31"]
dev = [
    "milk-adulteration[serve,train]",
    "dvc>=3.50",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
