[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milk-adulteration"
version = "0.1.0"
description = "Two-stage milk adulteration detection service (MLOps project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.24",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "dvc>=3.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
